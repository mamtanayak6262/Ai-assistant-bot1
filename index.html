
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
  height:100vh;
  overflow:hidden;
}
.app{display:flex;height:100vh}
.sidebar{
  width:260px;background:#10182b;padding:22px;
  border-right:1px solid #26334c;
  display:flex;flex-direction:column;gap:20px;
}
.logo{font-size:25px;font-weight:bold;color:#55d9ff}
.logo span{color:#fff}
.newchat{
  padding:13px;background:#172740;color:white;
  border:1px solid #344763;border-radius:10px;
  cursor:pointer;font-size:15px;
}
.newchat:hover{background:#203754}
.side-info{margin-top:auto;color:#91a2bd;font-size:12px;line-height:1.8}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:70px;padding:0 25px;display:flex;
  align-items:center;justify-content:space-between;
  border-bottom:1px solid #26334c;
}
.topbar h3{font-size:18px}
.status{color:#53e6a1;font-size:12px}
.chat{
  flex:1;overflow-y:auto;padding:30px 8%;
  display:flex;flex-direction:column;gap:22px;
}
.welcome{text-align:center;margin:auto;max-width:600px}
.welcome .big{font-size:55px;margin-bottom:15px}
.welcome h1{font-size:32px;margin-bottom:12px}
.welcome p{color:#9eabc1;line-height:1.6}
.suggestions{
 display:grid;grid-template-columns:1fr 1fr;
 gap:12px;margin-top:25px;
}
.suggestion{
 background:#131f35;border:1px solid #2c3b56;
 padding:15px;border-radius:12px;color:#dbe9ff;
 text-align:left;cursor:pointer;
}
.suggestion:hover{border-color:#38caff}
.message{display:flex;gap:12px;max-width:850px;width:100%;margin:0 auto}
.avatar{
 width:35px;height:35px;min-width:35px;
 background:#193b60;border-radius:10px;
 display:grid;place-items:center;
}
.message.user .avatar{background:#39436b}
.content{
 background:#121d32;padding:15px 18px;
 border-radius:12px;line-height:1.7;
 white-space:pre-wrap;overflow-wrap:anywhere;
 flex:1;
}
.message.user .content{background:#1b2d49}
.copy{
 margin-top:10px;padding:5px 10px;
 background:#23334d;color:#cfeaff;
 border:0;border-radius:6px;cursor:pointer;
}
.bottom{padding:15px 8% 20px}
.settings{
 display:flex;gap:10px;margin-bottom:12px;
 flex-wrap:wrap;
}
.settings input,.settings select{
 background:#121d32;border:1px solid #344763;
 color:white;padding:10px;border-radius:8px;
 min-width:0;
}
.settings input{flex:1}
.inputbox{
 display:flex;gap:10px;align-items:flex-end;
 background:#131e33;border:1px solid #344763;
 padding:12px;border-radius:15px;
}
textarea{
 flex:1;resize:none;max-height:150px;
 background:transparent;color:white;border:0;
 outline:none;font-size:16px;padding:8px;
}
.send{
 background:#24b8ed;color:#071426;
 border:0;border-radius:10px;padding:13px 20px;
 font-weight:bold;cursor:pointer;
}
.send:disabled{opacity:.5;cursor:not-allowed}
.note{text-align:center;color:#7e8ba2;font-size:11px;margin-top:10px}
.typing{color:#5dd8ff;font-size:14px}
@media(max-width:650px){
 .sidebar{width:65px;padding:12px 7px;align-items:center}
 .sidebar .logo{font-size:19px}
 .sidebar .logo span,.sidebar .side-info{display:none}
 .newchat{font-size:20px;padding:10px;width:48px}
 .chat{padding:20px 12px}
 .bottom{padding:12px}
 .topbar{padding:0 14px}
 .suggestions{grid-template-columns:1fr}
 .welcome h1{font-size:25px}
 .settings input{width:100%;flex:auto}
 .settings select{flex:1}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="logo">✦ <span>Nova AI</span></div>
  <button class="newchat" onclick="newChat()">＋ <span>New Chat</span></button>
  <div class="side-info">
    <b>Nova AI Assistant</b><br>
    Powered by Groq API<br><br>
    Fast AI conversations.
  </div>
</aside>

<main class="main">

<header class="topbar">
  <h3>✦ Nova AI Assistant</h3>
  <span class="status">● Ready</span>
</header>

<section class="chat" id="chat">

<div class="welcome" id="welcome">
  <div class="big">✦</div>
  <h1>Welcome to Nova AI</h1>
  <p>Your intelligent AI assistant. Ask anything, learn something new, write code or explore your ideas.</p>

  <div class="suggestions">
    <button class="suggestion" onclick="useSuggestion('Explain artificial intelligence in Hindi')">🧠 Explain AI</button>
    <button class="suggestion" onclick="useSuggestion('Write a simple HTML website')">💻 Write HTML Code</button>
    <button class="suggestion" onclick="useSuggestion('Give me 5 science project ideas')">🚀 Project Ideas</button>
    <button class="suggestion" onclick="useSuggestion('Tell me an interesting science fact')">🌍 Science Facts</button>
  </div>
</div>

</section>

<footer class="bottom">

  <div class="settings">
    <input type="password" id="apiKey" placeholder="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">
    <button onclick="toggleKey()" style="background:#263750;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer">Show</button>

    <select id="model">
      <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
      <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
    </select>
  </div>

  <div class="inputbox">
    <textarea id="prompt" rows="1" placeholder="Message Nova AI..."></textarea>
    <button class="send" id="sendBtn" onclick="sendMessage()">➤ Send</button>
  </div>

  <div class="note">
    Nova AI can make mistakes. Please verify important information.
  </div>
</footer>

</main>
</div>

<script>
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

let messages = [];
let loading = false;

const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

function toggleKey(){
  const key = document.getElementById("apiKey");
  key.type = key.type === "password" ? "text" : "password";
}

function addMessage(role,text){
  const welcome = document.getElementById("welcome");
  if(welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "👤" : "✦";

  const content = document.createElement("div");
  content.className = "content";
  content.textContent = text;

  div.appendChild(avatar);
  div.appendChild(content);

  if(role === "assistant"){
    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "📋 Copy";
    copy.onclick = async () => {
      try{
        await navigator.clipboard.writeText(text);
        copy.textContent = "Copied!";
      }catch(e){
        copy.textContent = "Copy unavailable";
      }
    };
    content.appendChild(document.createElement("br"));
    content.appendChild(copy);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
  const div = document.createElement("div");
  div.id = "typing";
  div.className = "message";
  div.innerHTML = '<div class="avatar">✦</div><div class="content typing">Nova AI is thinking...</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
  const el = document.getElementById("typing");
  if(el) el.remove();
}

async function sendMessage(){
  const text = promptBox.value.trim();
  const apiKey = document.getElementById("apiKey").value.trim();
  const model = document.getElementById("model").value;

  if(loading) return;
  if(!apiKey){
    alert("Please enter your Groq API Key first!");
    return;
  }
  if(!text) return;

  loading = true;
  sendBtn.disabled = true;
  promptBox.value = "";

  addMessage("user",text);
  messages.push({role:"user",content:text});

  showTyping();

  try{
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+apiKey
      },
      body:JSON.stringify({
        model:model,
        messages:[
          {
            role:"system",
            content:"You are Nova AI, a helpful, friendly and knowledgeable AI assistant. Answer clearly. Respond in the language used by the user. Explain coding questions with useful examples."
          },
          ...messages
        ],
        temperature:0.7,
        max_completion_tokens:2048
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error?.message || "API request failed: "+response.status);
    }

    const answer = data.choices?.[0]?.message?.content;

    if(!answer) throw new Error("No response received from AI.");

    messages.push({role:"assistant",content:answer});
    removeTyping();
    addMessage("assistant",answer);

  }catch(error){
    removeTyping();
    const errorText = "Error: "+error.message+
      "\n\nPlease check your API key, internet connection and selected model.";
    addMessage("assistant",errorText);
    messages.pop();
  }

  loading = false;
  sendBtn.disabled = false;
  promptBox.focus();
}

function useSuggestion(text){
  promptBox.value = text;
  sendMessage();
}

function newChat(){
  messages = [];
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="big">✦</div>
      <h1>Welcome to Nova AI</h1>
      <p>Your intelligent AI assistant. Ask anything, learn something new, write code or explore your ideas.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Explain artificial intelligence in Hindi')">🧠 Explain AI</button>
        <button class="suggestion" onclick="useSuggestion('Write a simple HTML website')">💻 Write HTML Code</button>
        <button class="suggestion" onclick="useSuggestion('Give me 5 science project ideas')">🚀 Project Ideas</button>
        <button class="suggestion" onclick="useSuggestion('Tell me an interesting science fact')">🌍 Science Facts</button>
      </div>
    </div>`;
}

promptBox.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

promptBox.addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,150)+"px";
});
</script>

</body>
</html>
